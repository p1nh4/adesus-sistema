name: Deploy QLD

on:
  push:
    branches:
      - qld

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 2222 192.168.100.53 >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -p 2222 sysadmin@192.168.100.53 "
            cd /srv/qld &&
            git pull &&
            composer install --no-interaction &&
            php artisan migrate --force &&
            php artisan config:clear
          "
